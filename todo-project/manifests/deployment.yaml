apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-project-dep
spec:
  replicas: 1
  # The image cache is a ReadWriteOnce volume, which only one node can mount. A rolling update
  # starts the new pod before stopping the old one, and on another node it would wait for the
  # disk forever, so stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-project
  template:
    metadata:
      labels:
        app: todo-project
    spec:
      volumes:
        - name: image-storage
          persistentVolumeClaim:
            claimName: todo-project-image-pvc
      containers:
        - name: todo-project
          image: todo-project:v2.9
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: todo-project-config
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_DIR
              value: /usr/src/app/files
            # The frontend checks the same limit as todo-backend, so it reads it from the backend's ConfigMap
            - name: TODO_MAX_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: TODO_MAX_LENGTH
          volumeMounts:
            - name: image-storage
              mountPath: /usr/src/app/files
