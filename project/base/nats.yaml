# NATS for the messages from todo-backend to broadcaster (exercise 4.6). Every environment has
# its own, so that the messages of one environment never reach the broadcaster of another one.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: nats-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.15.2-alpine3.22
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: project
  name: nats-svc
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
