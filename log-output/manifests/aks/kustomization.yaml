# Log output and what it needs: its readiness depends on ping-pong, which owns the Gateway.
# The image tags are set by .github/workflows/log-output.yaml on the branch release, which
# Argo CD follows (exercise 4.7). The database password is a SOPS-encrypted Secret, applied separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap.yaml
- deployment.yaml
- service.yaml
- ../../../ping-pong/manifests/aks
images:
- name: acrdwkakssc.azurecr.io/log-reader
  newTag: dfd0eb9f37ddfd6074bdc6a69ba4f29a819f3dc6
- name: acrdwkakssc.azurecr.io/log-writer
  newTag: dfd0eb9f37ddfd6074bdc6a69ba4f29a819f3dc6
