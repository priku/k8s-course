# The first example of the Knative guide (exercise 5.6)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  namespace: default
  name: hello
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "World"
