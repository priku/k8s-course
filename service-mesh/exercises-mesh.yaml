# Exercise 5.3: the namespace `exercises` in the mesh of the k3d cluster. The labels take the pods
# into ambient mode and send their traffic through the waypoint, which layer 7 routing needs.
apiVersion: v1
kind: Namespace
metadata:
  name: exercises
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  namespace: exercises
  name: waypoint
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
