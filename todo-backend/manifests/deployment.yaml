apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-backend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:v4.2
          imagePullPolicy: IfNotPresent
          # Exercise 4.2. Readiness: the database answers. Liveness: the process answers; it does not
          # check the database, so that a database outage does not restart the backend.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          # Measured under load (about 50 concurrent users): at most 110m CPU and 7Mi memory.
          # The request is what it needs normally, the limit leaves room for peaks.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          envFrom:
            - configMapRef:
                name: todo-backend-config
          env:
            - name: PORT
              value: "3000"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 3000
