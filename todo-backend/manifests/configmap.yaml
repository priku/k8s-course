apiVersion: v1
kind: ConfigMap
metadata:
  namespace: project
  name: todo-backend-config
data:
  TODO_MAX_LENGTH: "140"
  # Database connection, as the standard Postgres client variables.
  # The Postgres StatefulSet creates the same user and database from these.
  PGHOST: postgres-svc
  PGPORT: "5432"
  PGDATABASE: todos
  PGUSER: todo
  PGSSLMODE: disable
