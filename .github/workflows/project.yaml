name: Release the project

# Exercise 4.8: GitOps. Every push to main that changes the project builds its images, pushes them
# to the Azure Container Registry and writes their tags to the branch release. Argo CD in the
# cluster follows that branch, so this workflow never touches the cluster.
on:
  push:
    branches:
      - main
    paths:
      - 'todo-project/**'
      - 'todo-backend/**'
      - 'wiki-todo-generator/**'
      - 'broadcaster/**'
      - 'db-backup/**'
      - 'project/**'
      - '.github/workflows/project.yaml'
      # Documentation changes do not need a new version
      - '!**/*.md'

permissions:
  contents: write # to push to the branch release
  id-token: write # GitHub's OIDC token, exchanged for an Azure token by azure/login

# Two runs must not write to the branch release at the same time
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: acrdwkakssc.azurecr.io
  KUSTOMIZE_VERSION: 5.8.3
  APPS: todo-project todo-backend wiki-todo-generator db-backup broadcaster

jobs:
  release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest
    # The Azure identity trusts only jobs in this GitHub environment (terraform/github.tf)
    environment: aks

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, to merge main into the branch release

      - name: Sign in to Azure (OIDC, no stored passwords)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish the images
        run: |
          az acr login --name "${REGISTRY%%.*}"
          for app in $APPS; do
            docker build --tag "$REGISTRY/$app:project-$GITHUB_SHA" "$app"
            docker push "$REGISTRY/$app:project-$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Write the new tags to the branch release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch release 2>/dev/null || git switch -c release
          # The branch release is main plus the image tags, so on a conflict keep its tags
          git merge -X ours --no-edit "$GITHUB_SHA"
          cd project/aks
          for app in $APPS; do
            kustomize edit set image "$app=$REGISTRY/$app:project-$GITHUB_SHA"
          done
          git add kustomization.yaml
          git commit -m "Release the project $GITHUB_SHA"
          git push origin release
