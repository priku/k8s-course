name: Release the project to staging

# Exercises 4.8-4.10: GitOps. Every push to main that changes the project builds its images, pushes
# them to the Azure Container Registry and writes their tags to the configuration repository
# priku/k8s-course-config. Argo CD in the cluster follows that repository, so this workflow never
# touches the cluster. The image tag main-<sha> is a form that the weekly ACR purge recognizes.
on:
  push:
    branches:
      - main
    paths:
      - 'todo-project/**'
      - 'todo-backend/**'
      - 'wiki-todo-generator/**'
      - 'broadcaster/**'
      - '.github/workflows/project.yaml'
      # Documentation changes do not need a new version
      - '!**/*.md'

permissions:
  contents: read
  id-token: write # GitHub's OIDC token, exchanged for an Azure token by azure/login

# Two runs must not write to the configuration repository at the same time
concurrency:
  group: config-repository
  cancel-in-progress: false

env:
  REGISTRY: acrdwkakssc.azurecr.io
  KUSTOMIZE_VERSION: 5.8.3
  APPS: todo-project todo-backend wiki-todo-generator broadcaster

jobs:
  release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest
    # The Azure identity trusts only jobs in this GitHub environment (terraform/github.tf)
    environment: aks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the configuration repository
        uses: actions/checkout@v7
        with:
          repository: priku/k8s-course-config
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }} # a deploy key that can write only to that repository
          path: config

      - name: Sign in to Azure (OIDC, no stored passwords)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish the images
        run: |
          az acr login --name "${REGISTRY%%.*}"
          for app in $APPS; do
            docker build --tag "$REGISTRY/$app:main-$GITHUB_SHA" "$app"
            docker push "$REGISTRY/$app:main-$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Write the new tags to the configuration repository
        working-directory: config/overlays/staging
        run: |
          for app in $APPS; do
            kustomize edit set image "$app=$REGISTRY/$app:main-$GITHUB_SHA"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --cached --quiet || git commit -m "Release $GITHUB_SHA to staging"
          git push origin main
