name: 'Create Exercise Release'

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exercise tag to create a release for (e.g. 1.5)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 'Create GitHub Release'
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate Tag
        run: |
          # Course requires release names to match the exercise number
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not an exercise number (e.g. 1.5)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Create Release
        run: |
          if gh release view "$TAG" &> /dev/null; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi

          # Use the tagged commit's subject without the conventional commit prefix, exercise number or PR number
          SUBJECT=$(git log -1 --format=%s | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^Exercise [0-9]+\.[0-9]+:? *//; s/ \(#[0-9]+\)$//')

          gh release create "$TAG" \
            --verify-tag \
            --title "Exercise $TAG: $SUBJECT" \
            --notes "Code for exercise $TAG: https://github.com/${{ github.repository }}/tree/$TAG"
