name: Release the project to production

# Exercises 4.9 and 4.10: every tagged commit goes to production. The workflow builds the images and
# writes their tags to the configuration repository priku/k8s-course-config, which Argo CD follows.
# The tag production-<sha> is not touched by the weekly ACR purge, so that many pushes to main
# cannot delete what production runs.
on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write # GitHub's OIDC token, exchanged for an Azure token by azure/login

# Two runs must not write to the configuration repository at the same time
concurrency:
  group: config-repository
  cancel-in-progress: false

env:
  REGISTRY: acrdwkakssc.azurecr.io
  KUSTOMIZE_VERSION: 5.8.3
  APPS: todo-project todo-backend wiki-todo-generator db-backup broadcaster

jobs:
  release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest
    # The Azure identity trusts only jobs in this GitHub environment (terraform/github.tf)
    environment: aks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the configuration repository
        uses: actions/checkout@v7
        with:
          repository: priku/k8s-course-config
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }} # a deploy key that can write only to that repository
          path: config

      - name: Sign in to Azure (OIDC, no stored passwords)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish the images
        run: |
          az acr login --name "${REGISTRY%%.*}"
          for app in $APPS; do
            docker build --tag "$REGISTRY/$app:production-$GITHUB_SHA" "$app"
            docker push "$REGISTRY/$app:production-$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Write the new tags to the configuration repository
        working-directory: config/overlays/production
        run: |
          for app in $APPS; do
            kustomize edit set image "$app=$REGISTRY/$app:production-$GITHUB_SHA"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --cached --quiet || git commit -m "Release $GITHUB_REF_NAME to production ($GITHUB_SHA)"
          git push origin main
