# Alloy (k8s-monitoring): reads pod logs from the node filesystem and pushes them to Loki
cluster:
  name: k3d-dwk

destinations:
  localLoki:
    type: loki
    url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
    tenantId: "1"

podLogsViaLoki:
  enabled: true
  collector: alloy-singleton

collectors:
  alloy-singleton:
    presets: [filesystem-log-reader]

selfReporting:
  enabled: false
