apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: exercises
  name: app-ingress
  annotations:
    # ping-pong answers at its root since exercise 3.4: remove /pingpong before passing the request on
    traefik.ingress.kubernetes.io/router.middlewares: exercises-strip-pingpong@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /pingpong
        pathType: Prefix
        backend:
          service:
            name: ping-pong-svc
            port:
              number: 2345
      - path: /log-output
        pathType: Prefix
        backend:
          service:
            name: log-output-svc
            port:
              number: 2345
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  namespace: exercises
  name: strip-pingpong
spec:
  stripPrefix:
    prefixes:
      - /pingpong
