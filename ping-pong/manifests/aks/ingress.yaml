# Ingress for AKS, served by Traefik (see ../../../manifests/aks/traefik-values.yaml):
# ping-pong answers at /pingpong and Log output at everything else
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: exercises
  name: app-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /pingpong
            pathType: Prefix
            backend:
              service:
                name: ping-pong-svc
                port:
                  number: 2345
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-output-svc
                port:
                  number: 2345
