# Exercise 4.7: Argo CD keeps the cluster in the state described on the branch release
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: log-output
spec:
  project: default
  source:
    repoURL: https://github.com/priku/k8s-course
    targetRevision: release
    path: log-output/manifests/aks
  destination:
    server: https://kubernetes.default.svc
    namespace: exercises
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
