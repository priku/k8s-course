# Exercise 4.9: staging follows the branch staging, which every commit to main updates
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: project-staging
spec:
  project: default
  source:
    repoURL: https://github.com/priku/k8s-course
    targetRevision: staging
    path: project/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
