# Exercises 4.8 and 4.9: production follows the branch production, which every tag updates
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: project
spec:
  project: default
  source:
    repoURL: https://github.com/priku/k8s-course
    targetRevision: production
    path: project/aks
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
